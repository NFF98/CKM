name: B03 Android 原生 Kotlin 編譯（不打包 APK）

on:
  pull_request:
    paths:
      - 'build/app/src-tauri/plugins/tauri-plugin-cakami-ocr/android/**'
      - 'build/app/src-tauri/plugins/tauri-plugin-cakami-model/android/**'
      - '.github/workflows/b03-native-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin:
    name: 只檢查 Android 原生 OCR／Gemma Kotlin 編譯
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 更新 npm
        run: npm install -g npm@11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: 安裝 Android Gradle SDK
        run: |
          sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: 安裝 Tauri 開發依賴
        working-directory: build/app
        run: npm install --no-audit --no-fund
      - name: 生成 Android 專案（不建 APK）
        working-directory: build/app
        run: npx tauri android init --ci
      - name: 解析 Tauri Kotlin 核心來源（不執行 Android Bundle）
        run: |
          cargo metadata --format-version 1 --manifest-path build/app/src-tauri/Cargo.toml > /tmp/b03-metadata.json
          TAURI_MANIFEST=$(jq -r '.packages[] | select(.name=="tauri") | .manifest_path' /tmp/b03-metadata.json | head -n1)
          test -n "$TAURI_MANIFEST"
          TAURI_ANDROID_DIR="$(dirname "$TAURI_MANIFEST")/mobile/android"
          test -f "$TAURI_ANDROID_DIR/build.gradle.kts"
          echo "TAURI_ANDROID_DIR=$TAURI_ANDROID_DIR" >> "$GITHUB_ENV"
      - name: 建立僅三個 Library 的臨時 Gradle 設定
        working-directory: build/app/src-tauri/gen/android
        run: |
          # init 不產生 tauri.settings.gradle；這個檢查不修改 repo 或產出 APK。
          cat > settings.gradle <<'EOF'
          rootProject.name = 'ckm-native-compile-check'
          include ':tauri-android'
          include ':tauri-plugin-cakami-ocr'
          include ':tauri-plugin-cakami-model'
          EOF
          cat >> settings.gradle <<EOF
          project(':tauri-android').projectDir = new File("$TAURI_ANDROID_DIR")
          project(':tauri-plugin-cakami-ocr').projectDir = new File("$GITHUB_WORKSPACE/build/app/src-tauri/plugins/tauri-plugin-cakami-ocr/android")
          project(':tauri-plugin-cakami-model').projectDir = new File("$GITHUB_WORKSPACE/build/app/src-tauri/plugins/tauri-plugin-cakami-model/android")
          EOF
          ./gradlew projects --no-daemon
      - name: 只編譯 Android ML Kit 與 Gemma Kotlin 插件（沒有 APK）
        working-directory: build/app/src-tauri/gen/android
        run: |
          ./gradlew :tauri-plugin-cakami-ocr:compileDebugKotlin :tauri-plugin-cakami-model:compileDebugKotlin --no-daemon --stacktrace
      - name: Gemma 自動下載 Range／SHA256 Kotlin 單元測試（不打包 APK）
        working-directory: build/app/src-tauri/gen/android
        run: |
          ./gradlew :tauri-plugin-cakami-model:testDebugUnitTest --no-daemon --stacktrace
