[package]
name = "cakami_mobile"
version = "0.1.0"
description = "CAKAMI — 本地優先 AI 學伴"
edition = "2021"
build = "build.rs"

[lib]
name = "cakami_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
