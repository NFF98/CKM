[package]
name = "cakami_mobile"
version = "0.1.0"
description = "CAKAMI — 本地優先 AI 學伴"
edition = "2021"
build = "build.rs"

[lib]
name = "cakami_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-cakami-ocr = { path = "plugins/tauri-plugin-cakami-ocr" }
tauri-plugin-cakami-model = { path = "plugins/tauri-plugin-cakami-model" }

[dev-dependencies]
tempfile = "3"
